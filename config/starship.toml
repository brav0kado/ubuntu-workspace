add_newline = false
command_timeout = 1000
format = "$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"
right_format = "$python$nodejs$rust$golang"

[directory]
style = "bold #7aa2f7"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "#bb9af7"
format = "on [$symbol$branch]($style) "

[git_status]
style = "#e0af68"
format = '([$all_status$ahead_behind]($style) )'

[username]
style_user = "#7dcfff"
format = "[$user]($style) "

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "#7dcfff"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "#565f89"

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #bb9af7)"

[python]
symbol = "py "
format = '[${symbol}${version}( $virtualenv)]($style) '
style = "#e0af68"

[nodejs]
symbol = "node "
format = "[$symbol$version]($style) "
style = "#9ece6a"

[rust]
symbol = "rs "
format = "[$symbol$version]($style) "
style = "#f7768e"

[golang]
symbol = "go "
format = "[$symbol$version]($style) "
style = "#7dcfff"
